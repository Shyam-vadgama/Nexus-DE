# NEXUS-DE Base Hyprland Configuration
# Shared across Minimal, Core, and Hyper tiers

# Monitor setup
monitor = , preferred, auto, 1

# Input configuration
input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

# General Layout
general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    layout = dwindle
}

# Window Rules
windowrulev2 = suppressevent maximize, class:.*
windowrulev2 = float, class:^(org.nexus.Settings)$
windowrulev2 = center, class:^(org.nexus.Settings)$

# Keybindings
$mainMod = SUPER

# Core Navigation
bind = $mainMod, Return, exec, alacritty || foot || kitty
bind = $mainMod, Q, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, nautilus || thunar || dolphin
bind = $mainMod, V, togglefloating,
bind = $mainMod, Space, exec, quickshell -p ./shell/launcher/NexusLauncher.qml
bind = $mainMod, S, exec, nexus-settings

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5

# Move active window to workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

# Mouse window move / resize
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
